<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mikrofon-Test</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Mikrofon-Test für die Mini-App: aufnehmen, stoppen, abspielen. Alles bleibt auf dem Handy, nichts wird gesendet oder gespeichert. */
:root{--bg:#232124;--fl:#2b282b;--fg:#f4f0f0;--mute:#a39ca0;--line:#3a3639;--red:#e0475f;--ok:#5bbf8a;--warn:#e6a845}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 20px 40px}
h1{font-weight:300;font-size:1.9rem;margin:0 0 4px}
p{color:var(--mute);margin:0 0 18px}
.box{background:var(--fl);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.zeile{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:.92rem}
.zeile span{color:var(--mute)}
.ok{color:var(--ok)}.nein{color:var(--red)}.offen{color:var(--warn)}
button{width:100%;min-height:54px;border-radius:14px;border:0;font:600 1rem system-ui,sans-serif;margin-top:10px;color:#fff;background:var(--red)}
button.zweit{background:transparent;border:1px solid var(--line)}
button[disabled]{opacity:.4}
.zeit{font-weight:200;font-size:3rem;text-align:center;margin:6px 0}
audio{width:100%;margin-top:12px}
small{color:var(--mute);display:block;margin-top:14px;font-size:.8rem}
</style>
</head>
<body>
<h1>Mikrofon-Test</h1>
<p>Nur ein Test auf deinem Handy. Es wird nichts gesendet oder gespeichert.</p>

<div class="box">
 <div class="zeile"><span>Handy</span><b id="geraet">…</b></div>
 <div class="zeile"><span>Telegram</span><b id="tg">…</b></div>
 <div class="zeile"><span>Aufnahme möglich</span><b id="kann">…</b></div>
 <div class="zeile"><span>Mikrofon erlaubt</span><b id="erlaubt" class="offen">noch nicht gefragt</b></div>
</div>

<div class="box">
 <div class="zeit" id="zeit">0:00</div>
 <button id="start">🎙️ Aufnahme starten</button>
 <button id="stopp" class="zweit" disabled>■ Stopp</button>
 <audio id="hoeren" controls hidden></audio>
 <div class="zeile" id="ergebnis" hidden><span>Ergebnis</span><b id="erg"></b></div>
</div>
<small>Nach dem Test bitte kurz melden: Handy, ob „Mikrofon erlaubt“ grün war und ob du dich beim Abspielen gehört hast.</small>

<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();}
const $=id=>document.getElementById(id);
const ua=navigator.userAgent;
$('geraet').textContent=/iPhone|iPad/.test(ua)?'iPhone / iPad':/Android/.test(ua)?'Android':'anderes Gerät';
$('tg').textContent=tg&&tg.platform&&tg.platform!=='unknown'?('ja · '+tg.platform+' · '+(tg.version||'')):'außerhalb von Telegram';
const kann=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
$('kann').textContent=kann?'ja':'nein';$('kann').className=kann?'ok':'nein';
if(!kann)$('start').disabled=true;
let rec=null,teile=[],strom=null,t0=0,uhr=null;
$('start').onclick=async()=>{
 try{strom=await navigator.mediaDevices.getUserMedia({audio:true});}
 catch(e){$('erlaubt').textContent='nein ('+(e.name||'Fehler')+')';$('erlaubt').className='nein';return;}
 $('erlaubt').textContent='ja';$('erlaubt').className='ok';
 teile=[];rec=new MediaRecorder(strom);
 rec.ondataavailable=e=>{if(e.data.size)teile.push(e.data);};
 rec.onstop=()=>{const blob=new Blob(teile,{type:rec.mimeType||'audio/webm'});
  $('hoeren').src=URL.createObjectURL(blob);$('hoeren').hidden=false;
  $('ergebnis').hidden=false;$('erg').textContent=Math.round(blob.size/1024)+' KB · '+(rec.mimeType||'unbekannt');
  strom.getTracks().forEach(t=>t.stop());};
 rec.start();t0=Date.now();$('start').disabled=true;$('stopp').disabled=false;
 uhr=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('zeit').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');},250);
};
$('stopp').onclick=()=>{if(rec&&rec.state!=='inactive')rec.stop();clearInterval(uhr);$('start').disabled=false;$('stopp').disabled=true;};
</script>
</body>
</html>
